<html>

<head>

<body>
    <div id="particles-js"></div>

    <div id="three-container"></div>

    <!-- This is a simple clicker game where the user clicks a button to increase their score. 
         The score is displayed on the page and can be reset with a reset button. -->
    <div class="button" id="click-area">
        <h1>Click me</h1>
        <p id="click-count">0</p>
        <button id="reset-btn" class="reset-button">Reset</button>
    </div>

    <div id="image-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="js/click_button.js" defer></script>

</body>
